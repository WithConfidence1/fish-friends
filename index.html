document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

on;cursor:pointer;-webkit-user-select:none;user-select:none\">\n  <canvas ref=\"{{canvasRef}}\" style=\"display:block;width:100%;height:100%\"><\u002Fcanvas>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:820},\n&quot;level&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;auto (adaptive)&quot;,&quot;options&quot;:[&quot;auto (adaptive)&quot;,&quot;1 · count to 5&quot;,&quot;2 · count to 10&quot;,&quot;3 · add within 6&quot;,&quot;4 · add within 10&quot;,&quot;5 · take away (subtraction)&quot;,&quot;6 · pearl groups (multiplication)&quot;,&quot;7 · share the treats (division)&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Round&quot;},\n&quot;pace&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;quick demo&quot;,&quot;options&quot;:[&quot;quick demo&quot;,&quot;natural&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Round&quot;},\n&quot;voice&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sound&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      wrapRef: el => { this.wrap = el; },\n      canvasRef: el => { this.cv = el; },\n      onTap: e => this.tap(e),\n    };\n  }\n  componentDidMount() { this.boot(); }\n  componentWillUnmount() { this.dead = true; cancelAnimationFrame(this.raf); if (this.ro) this.ro.disconnect(); try { speechSynthesis.cancel(); } catch (e) {} }\n\n  progress() {\n    if (!this._prog) { try { this._prog = JSON.parse(localStorage.getItem('tap-count-progress') || '{\"lvl\":1,\"streak\":0}'); } catch (e) { this._prog = { lvl: 1, streak: 0 }; } }\n    return this._prog;\n  }\n  level() { const m = String(this.props.level || 'auto').match(/^(\\d)/); return m ? +m[1] : Math.max(1, Math.min(5, this.progress().lvl)); }\n  voiceOn() { return this.props.voice !== false; }\n  freeDur() { return String(this.props.pace || 'quick demo').startsWith('quick') ? 5 : 14; }\n\n  async boot() {\n    const names = ['fish-orange', 'fish-blue', 'fish-yellow', 'fish-pink', 'fish-purple', 'fish-green', 'turtle', 'jelly-blue', 'jelly-pink', 'starfish', 'starfish-pink', 'coral-pink', 'shell', 'chest', 'star-gold', 'heart', 'bubble-speech', 'crab', 'gem-purple', 'gem-blue', 'gem-pink', 'gem-teal', 'coin', 'pearl-orb', 'clam-pink', 'clam-purple', 'star-big', 'seahorse', 'puffer', 'ray', 'hermit', 'weed-a', 'weed-b', 'weed-d', 'coral-blue', 'bg-reef', 'bg-wreck', 'bg-cave'];\n    this.im = {};\n    await Promise.all(names.map(n => { const i = new Image(); i.src = 'assets/kit/' + n + '.png'; return i.decode().then(() => { this.im[n] = i; }).catch(() => {}); }));\n    try { await document.fonts.load('800 60px \"Baloo 2\"'); } catch (e) {}\n    const fit = () => { if (!this.cv || !this.wrap) return; const dpr = Math.min(2, window.devicePixelRatio || 1); const r = this.wrap.getBoundingClientRect(); this.W = r.width; this.H = r.height; this.dpr = dpr; this.cv.width = Math.round(r.width * dpr); this.cv.height = Math.round(r.height * dpr); };\n    this.ro = new ResizeObserver(fit); this.ro.observe(this.wrap); fit();\n    try { this.lock = await navigator.wakeLock.request('screen'); } catch (e) {}\n\n    this.treasures = []; try { this.treasures = JSON.parse(localStorage.getItem('tap-count-treasures') || '[]').slice(0, 40); } catch (e) {}\n    this.treasures = this.treasures.map((t, i) => Object.assign({ img: t.img }, this.tSlot(i)));\n    this.fish = []; this.parts = []; this.ambB = [];\n    this.phase = 'free'; this.pt = 0; this.clock = 0; this.roundN = 4; this.counted = 0; this.lastTapT = 0; this.assistLvl = 0;\n    this.turtle = { x: -0.22, y: 0.68, tx: 0.1, ty: 0.68, dir: 1, bob: Math.random() * 9 };\n    const dCols = ['blue', 'yellow', 'pink', 'purple', 'green', 'blue', 'pink'];\n    dCols.forEach((c, i) => this.addFish(c, Math.random(), 0.15 + Math.random() * 0.55));\n    this.petCount = Math.min(this.petDefs.length, Math.floor(this.treasures.length / 5));\n    for (let i = 0; i < this.petCount; i++) this.addPet(i, false);\n    this.bgIdx = this.bgIdxFor(this.treasures.length); this.bgFade = 1;\n    for (let i = 0; i < this.roundN; i++) this.addFish('orange', Math.random(), 0.2 + Math.random() * 0.45);\n    this.jellies = [{ img: 'jelly-blue', x: 0.12, y: 0.5, s: 0.9, ph: 0 }, { img: 'jelly-pink', x: 0.9, y: 0.3, s: 1, ph: 3 }];\n    this.crab = { x: 0.4, dir: 1, pause: 0 };\n    this.last = performance.now();\n    const loop = t => { if (this.dead) return; this.raf = requestAnimationFrame(loop); this.tick(t); };\n    this.raf = requestAnimationFrame(loop);\n  }\n\n  petDefs = [\n    { img: 'seahorse', base: 52, facing: -1, speed: 0.012, yr: [0.35, 0.65] },\n    { img: 'puffer', base: 70, facing: -1, speed: 0.018, yr: [0.2, 0.55] },\n    { img: 'ray', base: 110, facing: -1, speed: 0.026, yr: [0.55, 0.72] },\n    { img: 'hermit', base: 56, facing: 1, speed: 0.008, yr: [0.78, 0.8] },\n  ];\n  addPet(i, entering) {\n    const def = this.petDefs[i]; if (!def || this.fish.some(f => f.id === 'pet-' + def.img)) return;\n    const f = { id: 'pet-' + def.img, color: 'pet', img: def.img, x: entering ? -0.12 : 0.15 + Math.random() * 0.7, y: def.yr[0] + Math.random() * (def.yr[1] - def.yr[0]), dir: 1, face: 1, speed: def.speed, ph: Math.random() * 9, mode: 'swim', bounce: 0, num: 0, wig: 0, shy: 0, facing: def.facing, petBase: def.base, yr: def.yr };\n    f.wy = f.y; this.fish.push(f);\n  }\n  bgIdxFor(n) { return n >= 30 ? 3 : n >= 20 ? 2 : n >= 10 ? 1 : 0; }\n  bgNames = ['', 'bg-reef', 'bg-wreck', 'bg-cave'];\n  tSlot(i) { const col = i % 9, row = Math.floor(i / 9); return { x: 0.585 + col * 0.0435 + (row % 2) * 0.02, y: 0.902 - row * 0.03 }; }\n  addFish(color, x, y) {\n    const f = { id: Math.random(), color, img: 'fish-' + color, x, y, wy: y, dir: Math.random() < 0.5 ? 1 : -1, speed: 0.03 + Math.random() * 0.025, ph: Math.random() * 9, mode: 'swim', bounce: 0, num: 0, wig: 0, shy: 0 };\n    f.facing = color === 'orange' ? -1 : 1; f.face = f.dir;\n    this.fish.push(f); return f;\n  }\n\n  // ---------- audio ----------\n  ac() { if (!this._ac) { try { this._ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return this._ac; }\n  blip(f0, f1, dur, vol, type) {\n    const a = this.ac(); if (!a) return;\n    const o = a.createOscillator(), g = a.createGain();\n    o.type = type || 'sine'; o.frequency.setValueAtTime(f0, a.currentTime); o.frequency.exponentialRampToValueAtTime(f1, a.currentTime + dur);\n    g.gain.setValueAtTime(vol || 0.12, a.currentTime); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);\n    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur);\n  }\n  chord() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.blip(f, f * 1.01, 0.35, 0.1, 'triangle'), i * 120)); }\n  pickVoice() {\n    if (this._voice !== undefined) return this._voice;\n    try {\n      const vs = speechSynthesis.getVoices();\n      if (!vs.length) { speechSynthesis.onvoiceschanged = () => { this._voice = undefined; this.pickVoice(); }; return null; }\n      const pref = ['Samantha', 'Google US English', 'Zoe', 'Ava', 'Allison', 'Karen', 'Serena'];\n      this._voice = pref.map(p => vs.find(v => v.name.indexOf(p) >= 0)).find(v => v)\n        || vs.find(v => v.lang === 'en-US' && v.localService) || vs.find(v => v.lang && v.lang.indexOf('en') === 0) || null;\n    } catch (e) { this._voice = null; }\n    return this._voice;\n  }\n  tts(text, opts) {\n    try {\n      speechSynthesis.cancel();\n      const u = new SpeechSynthesisUtterance(text);\n      const v = this.pickVoice(); if (v) u.voice = v;\n      u.lang = 'en-US'; u.rate = (opts && opts.rate) || 0.95; u.pitch = 1.05;\n      speechSynthesis.speak(u);\n    } catch (e) {}\n  }\n  say(text, opts) {\n    if (!this.voiceOn()) return;\n    // recorded clips first (see Voice Handoff.md), browser voice as fallback\n    const slug = text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 80);\n    this._noClip = this._noClip || {};\n    if (this._noClip[slug]) { this.tts(text, opts); return; }\n    try {\n      if (this.curClip) { try { this.curClip.pause(); } catch (e) {} }\n      try { speechSynthesis.cancel(); } catch (e) {}\n      const a = new Audio('assets/voice/' + slug + '.mp3');\n      this.curClip = a;\n      a.play().catch(() => { this._noClip[slug] = true; this.tts(text, opts); });\n    } catch (e) { this.tts(text, opts); }\n  }\n\n  // ---------- state machine ----------\n  setPhase(p) { this.phase = p; this.pt = 0; }\n  words = ['one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];\n\n  slots(n, isAdd, A) {\n    const out = [];\n    if (isAdd) {\n      for (const [cx, m, y0] of [[0.32, A, 0.34], [0.7, n - A, 0.36]]) {\n        const sp = m > 1 ? Math.min(0.11, 0.3 / (m - 1)) : 0;\n        for (let i = 0; i < m; i++) out.push({ x: cx + (i - (m - 1) / 2) * sp, y: y0 + (i % 2) * 0.07 });\n      }\n    } else if (n <= 5) {\n      const sp = Math.min(0.2, 0.72 / Math.max(1, n - 1));\n      for (let i = 0; i < n; i++) out.push({ x: 0.52 + (i - (n - 1) / 2) * sp, y: 0.32 + (i % 2) * 0.09 });\n    } else {\n      const top = Math.ceil(n / 2);\n      [[top, 0.24], [n - top, 0.44]].forEach(([m, y0]) => {\n        const sp = Math.min(0.15, 0.7 / Math.max(1, m - 1));\n        for (let i = 0; i < m; i++) out.push({ x: 0.52 + (i - (m - 1) / 2) * sp, y: y0 + (i % 2) * 0.045 });\n      });\n    }\n    return out;\n  }\n\n  startRound() {\n    const lvl = this.level();\n    this.roundType = 'count'; this.A = 0; this.B = 0;\n    if (lvl === 1) this.roundN = 2 + Math.floor(Math.random() * 4);\n    else if (lvl === 2) this.roundN = 6 + Math.floor(Math.random() * 5);\n    else if (lvl === 5) {\n      this.roundType = 'sub';\n      this.A = 4 + Math.floor(Math.random() * 5);              // 4..8 fish arrive\n      this.B = 1 + Math.floor(Math.random() * (this.A - 2));   // some swim away, at least 2 stay\n      this.roundN = this.A - this.B;\n    } else if (lvl === 6) {\n      this.roundType = 'mul';\n      this.A = 2 + Math.floor(Math.random() * 2);   // shells (groups)\n      this.B = 2 + Math.floor(Math.random() * 2);   // pearls in each\n      this.roundN = this.A * this.B;\n    } else if (lvl === 7) {\n      this.roundType = 'div';\n      this.A = 2 + Math.floor(Math.random() * 2);   // fish to share between\n      this.B = 2 + Math.floor(Math.random() * 2);   // treats each\n      this.roundN = this.A * this.B;                // total treats\n    } else {\n      this.roundType = 'add';\n      const hi = lvl === 3 ? 3 : 5, lo = lvl === 3 ? 1 : 2;\n      this.A = lo + Math.floor(Math.random() * (hi - lo + 1));\n      this.B = lo + Math.floor(Math.random() * (hi - lo + 1));\n      this.roundN = this.A + this.B;\n    }\n    this.counted = 0; this.assistLvl = 0; this.assistMax = 0; this.lastTapT = this.clock;\n    // ensure orange population === roundN\n    this.pearls = null; this.shells = null; this.feedFish = null; this.pellLeft = 0; this.flying = []; this._divDone = false;\n    const want = this.roundType === 'sub' || this.roundType === 'div' ? this.A : this.roundType === 'mul' ? 0 : this.roundN;\n    if (this.roundType !== 'mul') {\n      const or = this.fish.filter(f => f.color === 'orange');\n      for (let i = or.length; i < want; i++) { const f = this.addFish('orange', -0.1, 0.2 + Math.random() * 0.4); f.dir = 1; }\n      while (this.fish.filter(f => f.color === 'orange').length > want) { const f = this.fish.find(x => x.color === 'orange'); f.mode = 'leave'; f.color = 'gone'; }\n    }\n    const oranges = this.fish.filter(f => f.color === 'orange').slice(0, want);\n    if (this.roundType === 'mul') {\n      this.shells = []; this.pearls = [];\n      const G = this.A, P = this.B, gsp = G > 1 ? Math.min(0.26, 0.6 / (G - wH = (h || 150) * fsc, wW = wH * wimg.width / wimg.height; ctx.save(); ctx.translate(x, sandY + 10); ctx.rotate(rot); ctx.drawImage(wimg, -wW / 2, -wH, wW, wH); ctx.restore(); };\n    weed(im['weed-b'], 0.05 * W, sway, 160); weed(im['weed-a'], 0.115 * W, -sway * 0.7, 110); weed(im['weed-d'], 0.945 * W, -sway, 165);\n    this.drawImgC(ctx, im['coral-blue'], 0.17 * W, sandY - 34 * fsc, 76 * fsc);\n    this.drawImgC(ctx, im['coral-pink'], 0.24 * W, sandY - 28 * fsc, 64 * fsc);\n    // starfish (hop on celebrate)\n    const hop = this.starHop && this.clock - this.starHop < 1.6 ? Math.abs(Math.sin((this.clock - this.starHop) * 6)) * 26 * fsc : 0;\n    this.drawImgC(ctx, im.starfish, 0.33 * W, sandY + 20 * fsc - hop, 52 * fsc, false, Math.sin(this.clock) * 0.08);\n    this.drawImgC(ctx, im['starfish-pink'], 0.55 * W, sandY + 26 * fsc - hop * 0.7, 40 * fsc, true, -0.2);\n    // crab\n    this.drawImgC(ctx, im.crab, this.crab.x * W, sandY + 14 * fsc - (this.crab.pause <= 0 ? Math.abs(Math.sin(this.clock * 7)) * 5 : 0), 70 * fsc, this.crab.dir < 0);\n    // chest + treasures\n    this.drawImgC(ctx, im.chest, 0.86 * W, sandY + 22 * fsc, 92 * fsc);\n    const tW = { shell: 40, 'star-gold': 32, heart: 32, 'starfish-pink': 38, coin: 28, 'pearl-orb': 32, 'clam-pink': 38, 'clam-purple': 38, 'star-big': 36 };\n    for (const tr of this.treasures) this.drawImgC(ctx, im[tr.img], tr.x * W, tr.y * H, (tW[tr.img] || 28) * fsc, false, Math.sin(tr.x * 40) * 0.3);\n    if (this.falling) this.drawImgC(ctx, im[this.falling.img], this.falling.x * W, this.falling.y * H, (tW[this.falling.img] || 28) * 1.15 * fsc, false, Math.sin(this.clock * 3) * 0.2);\n    // jellies\n    for (const j of this.jellies) {\n      const pump = Math.max(0, Math.sin(j.ph * 2.2)) + (j.squish || 0) * 1.6;\n      this.drawImgC(ctx, im[j.img], j.x * W, j.y * H, 62 * fsc * j.s * (1 + pump * 0.09), false, Math.sin(j.ph * 0.7) * 0.1, 1 - pump * 0.12);\n    }\n    // turtle\n    const tu = this.turtle;\n    if (tu.x > -0.2) {\n      const tw = 150 * fsc;\n      const paddling = Math.abs(tu.tx - tu.x) > 0.01;\n      this.drawImgC(ctx, im.turtle, tu.x * W, (tu.y + Math.sin(tu.bob * 1.6) * 0.012) * H, tw * (1 + Math.sin(tu.bob * 3.2) * (paddling ? 0.02 : 0.008)), tu.dir > 0, Math.sin(tu.bob * 1.6 + 1) * 0.07);\n    }\n    // target fish on top\n    if ((dimOthers || this.phase === 'celebrate') && this.roundType !== 'mul') for (const f of this.fish) if (f.color === 'orange') this.drawFish(ctx, f, fsc, 1, f.mode === 'gather' || f.mode === 'pregather');\n    this.drawMulDiv(ctx, sandY, fsc);\n    if ((this.phase === 'invite' || this.phase === 'count') && this.roundType !== 'div') this.drawPrompt(ctx, fsc); // prompt strip on top, near the surface\n    // assist ring\n    if (this.phase === 'count' && this.assistLvl >= 1) {\n      const next = this.roundType === 'div' ? (this.feedFish || []).slice().sort((a, b) => a.fed - b.fed)[0] : (this.targets || []).find(x => !x.num);\n      if (next) {\n        const pr = (this.clock * 1.5) % 1;\n        ctx.save(); ctx.globalAlpha = (1 - pr) * 0.7; ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 5;\n        ctx.beginPath(); ctx.ellipse(next.x * W, next.y * H + 52 * fsc, (40 + pr * 44) * fsc, (14 + pr * 16) * fsc, 0, 0, 7); ctx.stroke(); ctx.restore();\n      }\n    }\n    // particles\n    for (const p of this.parts) {\n      ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, p.life));\n      if (p.bub || !p.img) {\n        ctx.strokeStyle = '#EAF9FF'; ctx.lineWidth = 2.5;\n        ctx.beginPath(); ctx.arc(p.x * W, p.y * H, p.sz * 0.5 * fsc, 0, 7); ctx.stroke();\n        ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fill();\n      } else { const pop = Math.min(1, (1 - p.life) * 6 + 0.25) * (0.55 + 0.45 * p.life); this.drawImgC(ctx, im[p.img], p.x * W, p.y * H, p.sz * fsc * pop, false, p.rot); }\n      ctx.restore();\n    }\n    // ambient bubbles\n    ctx.strokeStyle = 'rgba(240,252,255,0.6)'; ctx.lineWidth = 2;\n    for (const b of this.ambB) { ctx.beginPath(); ctx.arc(b.x * W + Math.sin(b.y * 12) * 8, b.y * H, b.sz * 0.5 * fsc, 0, 7); ctx.stroke(); }\n  }\n\n  pellet(ctx, x, y, r) {\n    ctx.save();\n    const g2 = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.2, x, y, r);\n    g2.addColorStop(0, '#DDA75F'); g2.addColorStop(1, '#996829');\n    ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();\n    ctx.restore();\n  }\n\n  drawMulDiv(ctx, sandY, fsc) {\n    const im = this.im, W = this.W, H = this.H;\n    if (this.shells) {\n      for (const s of this.shells) this.drawImgC(ctx, im.shell, s.x * W, sandY - 16 * fsc, 88 * fsc);\n      for (const p of this.pearls) {\n        const bo = p.bounce > 0 ? -Math.sin((1 - Math.min(1, p.bounce)) * Math.PI) * 22 * fsc : 0;\n        const wob = Math.sin(this.clock * 12) * 4 * p.wig;\n        const px = p.x * W + wob, py = p.y * H + Math.sin(this.clock * 1.6 + p.seed) * 4 + bo;\n        const r = 19 * fsc;\n        ctx.save();\n        if (p.num) { ctx.shadowColor = 'rgba(255,214,79,0.95)'; ctx.shadowBlur = 18; }\n        const gr = ctx.createRadialGradient(px - r * 0.35, py - r * 0.4, r * 0.15, px, py, r);\n        gr.addColorStop(0, '#FFFFFF'); gr.addColorStop(0.7, '#EAF0F6'); gr.addColorStop(1, '#B9C8D8');\n        ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(px, py, r, 0, 7); ctx.fill();\n        ctx.strokeStyle = 'rgba(90,110,130,0.45)'; ctx.lineWidth = 2; ctx.stroke();\n        if (p.num) { ctx.fillStyle = '#F4711F'; ctx.font = '800 ' + Math.round(r * 1.2) + 'px \"Baloo 2\", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(p.num), px, py + 1); }\n        ctx.restore();\n      }\n    }\n    if (this.feedFish) {\n      for (let i = 0; i < this.pellLeft; i++) {\n        const px = (0.5 + ((i % 5) - 2) * 0.032) * W, py = (0.1 + Math.floor(i / 5) * 0.04) * H + Math.sin(this.clock * 2 + i) * 2;\n        this.pellet(ctx, px, py, 9 * fsc);\n      }\n      for (const fl of this.flying || []) {\n        const t = Math.min(1, fl.t), xx = 0.5 + (fl.f.x - 0.5) * t, yy = 0.12 + (fl.f.y - 0.12) * t - Math.sin(t * Math.PI) * 0.1;\n        this.pellet(ctx, xx * W, yy * H, 10 * fsc);\n      }\n      for (const f of this.feedFish) for (let i = 0; i < (f.fed || 0); i++) this.pellet(ctx, f.x * W + (i - (f.fed - 1) / 2) * 24 * fsc, f.y * H + 60 * fsc, 8 * fsc);\n    }\n  }\n\n  drawFish(ctx, f, fsc, alpha, isTarget) {\n    const im = this.im[f.img]; if (!im || f.color === 'gone' && !im) return;\n    const base = f.petBase || (f.color === 'orange' ? 128 : { blue: 86, yellow: 82, pink: 70, purple: 56, green: 72 }[f.color] || 80);\n    let w = base * fsc * (isTarget ? 1.15 : 1);\n    if (isTarget) w = Math.min(w, this.W * (this.slotPitch || 0.2) * 1.45, this.H * 0.27);\n    f.w = w;\n    // tap bounce: anticipation squash -> hop with stretch -> soft landing\n    const p = 1 - Math.min(1, f.bounce);\n    const hopY = f.bounce > 0 ? -Math.sin(p * Math.PI) * 38 * fsc : 0;\n    let sy = 1;\n    if (f.bounce > 0) sy = 1 + Math.sin(p * Math.PI * 2 - Math.PI / 2) * 0.15 * (1 - p * 0.5);\n    // celebration loop-de-loop: fly a vertical circle\n    let loopOx = 0, loopOy = 0, loopRot = 0;\n    if (f.loop != null && f.loop > 0) { const a = Math.min(1, f.loop) * Math.PI * 2, r = 46 * fsc; loopOx = Math.sin(a) * r; loopOy = -(1 - Math.cos(a)) * r * 0.8; loopRot = -a; }\n    const wigR = Math.sin(this.clock * 13) * 0.3 * f.wig * f.wig;\n    const swimRot = Math.sin(f.ph * 0.9) * 0.05;   // gentle body rock with the tail beat\n    const bobY = Math.sin(f.ph * 0.9) * w * 0.04;\n    const face = f.face === undefined ? f.dir : f.face;\n    let sx = face * (f.facing || 1); sx = (sx < 0 ? -1 : 1) * Math.max(0.15, Math.abs(sx)); // thin mid-turn\n    sx *= 2 - sy; // preserve volume through squash/stretch\n    const rot = loopRot + wigR + swimRot;\n    ctx.save(); ctx.globalAlpha = alpha;\n    if (isTarget && !f.num) { ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 14; }\n    if (f.num) { ctx.shadowColor = 'rgba(255,214,79,0.95)'; ctx.shadowBlur = 20; }\n    this.drawImgC(ctx, im, f.x * this.W + loopOx, f.y * this.H + hopY + bobY + loopOy, w, false, rot, sy, sx);\n    ctx.restore();\n    const bounceY = hopY + bobY + loopOy;\n    if (f.num) {\n      const bx = f.x * this.W + loopOx, by = f.y * this.H - w * 0.62 + bounceY + Math.sin(this.clock * 2 + f.num) * 3;\n      const r = Math.max(20, w * 0.26);\n      ctx.save();\n      ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.strokeStyle = '#FF8A3C'; ctx.lineWidth = 4;\n      ctx.beginPath(); ctx.arc(bx, by, r, 0, 7); ctx.fill(); ctx.stroke();\n      ctx.fillStyle = '#F4711F'; ctx.font = '800 ' + Math.round(r * (f.num > 9 ? 1.0 : 1.3)) + 'px \"Baloo 2\", \"Comic Sans MS\", sans-serif';\n      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';\n      ctx.fillText(String(f.num), bx, by + r * 0.08);\n      ctx.restore();\n    }\n  }\n\n  drawPrompt(ctx, fsc) {\n    const im = this.im;\n    const bw = Math.min(this.W * 0.72, 640 * fsc);\n    const bx = this.W / 2, by = Math.max(52 * fsc, this.H * 0.085), bh = 0;\n    if (this.roundType === 'mul') { // groups of pearl dots\n      const G = this.A, P = this.B, dr = Math.min(13 * fsc, bw * 0.035), gap = dr * 2.6;\n      const total = G * P * dr * 2.4 + (G - 1) * gap;\n      let k = 0;\n      for (let g = 0; g < G; g++) for (let j = 0; j < P; j++) {\n        const px = bx - total / 2 + dr + k * dr * 2.4 + g * gap, py = by - bh * 0.08;\n        ctx.save(); ctx.globalAlpha = k < this.counted ? 1 : 0.5;\n        const gr = ctx.createRadialGradient(px - dr * 0.3, py - dr * 0.3, dr * 0.2, px, py, dr);\n        gr.addColorStop(0, '#FFFFFF'); gr.addColorStop(1, '#B9C8D8');\n        ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(px, py, dr, 0, 7); ctx.fill();\n        ctx.strokeStyle = 'rgba(90,110,130,0.4)'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore();\n        k++;\n      }\n      return;\n    }\n    if (this.roundType === 'div') { // mini fish, treats fill in beneath each\n      const D = this.A, fw2 = Math.min(38, bw * 0.7 / D);\n      for (let i = 0; i < D; i++) {\n        const mx = bx - (D - 1) / 2 * fw2 * 1.4 + i * fw2 * 1.4, my2 = by - bh * 0.16;\n        this.drawImgC(ctx, this.im['fish-orange'], mx, my2, fw2 * 0.9, true);\n        const fed = (this.feedFish && this.feedFish[i]) ? this.feedFish[i].fed : 0;\n        for (let j = 0; j < fed; j++) this.pellet(ctx, mx + (j - (fed - 1) / 2) * 11, my2 + fw2 * 0.6, 4.5);\n      }\n      return;\n    }\n    // mini orange fish inside, filled in as counted; add/sub show two groups with a sign\n    const n = this.roundN, isAdd = this.roundType === 'add', isSub = this.roundType === 'sub', A = this.A;\n    const showN = isSub ? A + this.B : n;      // subtraction reads \"A − B\": school, then the take-away group\n    const split = isAdd || isSub ? A : -1;     // where the sign sits\n    const gap = split > 0 ? Math.min(34 * fsc, bw * 0.09) : 0;\n    const fw = Math.min(58 * fsc, (bw * 0.9 - gap) / showN);\n    const total = showN * fw + gap, my = by - bh * 0.08;\n    const xs = []; for (let i = 0; i < showN; i++) xs.push(bx - total / 2 + fw / 2 + i * fw + (split > 0 && i >= split ? gap : 0));\n    if (split > 0 && split < showN) {\n      ctx.save(); ctx.fillStyle = '#F4711F'; ctx.font = '800 ' + Math.round(fw * 0.9) + 'px \"Baloo 2\", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';\n      ctx.fillText(isAdd ? '+' : '\\u2212', (xs[split - 1] + xs[split]) / 2, my); ctx.restore();\n    }\n    for (let i = 0; i < showN; i++) {\n      let a;\n      if (isSub) {\n        const inMinus = i >= A;                        // the \"take away\" group after the sign\n        const leftSlot = !inMinus && i >= A - this.B;  // school members who swim off\n        a = inMinus ? (this.subGone ? 0.95 : 0.3) : leftSlot && this.subGone ? 0.28 : i < this.counted ? 1 : 0.85;\n      } else a = i < this.counted ? 1 : 0.5;\n      ctx.save(); ctx.globalAlpha = a;\n      this.drawImgC(ctx, im['fish-orange'], xs[i], my, fw * 0.9, true);\n      ctx.restore();\n      if (i < this.counted && (!isSub || i < A - this.B)) {\n        ctx.save(); ctx.fillStyle = '#F4711F'; ctx.font = '800 ' + Math.round(fw * 0.42) + 'px \"Baloo 2\", sans-serif'; ctx.textAlign = 'center';\n        ctx.fillText(String(i + 1), xs[i], my - fw * 0.5); ctx.restore();\n      }\n    }\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"

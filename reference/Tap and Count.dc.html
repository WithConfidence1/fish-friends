<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:820},
&quot;level&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;auto (adaptive)&quot;,&quot;options&quot;:[&quot;auto (adaptive)&quot;,&quot;1 · count to 5&quot;,&quot;2 · count to 10&quot;,&quot;3 · add within 6&quot;,&quot;4 · add within 10&quot;,&quot;5 · take away (subtraction)&quot;,&quot;6 · pearl groups (multiplication)&quot;,&quot;7 · share the treats (division)&quot;,&quot;8 · count to 20&quot;,&quot;9 · tap until (missing addend)&quot;,&quot;10 · make ten (number bonds)&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Round&quot;},
&quot;pace&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;natural&quot;,&quot;options&quot;:[&quot;quick demo&quot;,&quot;natural&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Round&quot;},
&quot;voice&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sound&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      wrapRef: el => { this.wrap = el; },
      canvasRef: el => { this.cv = el; },
      onTap: e => this.tap(e),
    };
  }
  componentDidMount() { this.boot(); }
  componentWillUnmount() { this.dead = true; cancelAnimationFrame(this.raf); if (this.ro) this.ro.disconnect(); }

  progress() {
    if (!this._prog) { try { this._prog = JSON.parse(localStorage.getItem('tap-count-progress') || '{"lvl":1,"streak":0}'); } catch (e) { this._prog = { lvl: 1, streak: 0 }; } }
    return this._prog;
  }
  settings() {
    if (!this._settings) {
      let s = {};
      try { s = JSON.parse(localStorage.getItem('tap-count-settings') || '{}'); } catch (e) {}
      const propLevel = String(this.props.level || 'auto');
      const propPace = String(this.props.pace || 'natural');
      this._settings = {
        level: s.level != null ? s.level : (propLevel.match(/^(\d+)/) ? +propLevel.match(/^(\d+)/)[1] : 'auto'),
        pace: s.pace || (propPace.startsWith('quick') ? 'quick' : 'natural'),
        voice: s.voice != null ? s.voice : this.props.voice !== false,
      };
    }
    return this._settings;
  }
  saveSettings(patch) {
    Object.assign(this.settings(), patch);
    try { localStorage.setItem('tap-count-settings', JSON.stringify(this._settings)); } catch (e) {}
    this.persist();
  }
  persist() {
    try {
      if (window.webkit && webkit.messageHandlers && webkit.messageHandlers.persist) {
        const g = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
        webkit.messageHandlers.persist.postMessage({
          progress: g('tap-count-progress'), treasures: g('tap-count-treasures'),
          settings: g('tap-count-settings'), backup: g('tap-count-backup') });
      }
    } catch (e) {}
  }
  level() { const l = this.settings().level; return l === 'auto' ? Math.max(1, Math.min(10, this.progress().lvl)) : l; }
  voiceOn() { return this.settings().voice; }
  freeDur() { return this.settings().pace === 'quick' ? 5 : 14; }

  // ---------- grown-up settings overlay ----------
  openSettings() {
    if (this.settingsOpen) return;
    this.settingsOpen = true;
    this._gateTaps = [];
    clearTimeout(this._gateHoldTimer); this._gateHoldTimer = null;
    this._clearState = 'idle';
    clearTimeout(this._clearArmTimer); this._clearArmTimer = null;
    const s = this.settings();
    const scrim = document.createElement('div');
    scrim.style.cssText = 'position:absolute;inset:0;background:rgba(8,40,56,0.55);display:flex;align-items:center;justify-content:center;z-index:1000;';
    const card = document.createElement('div');
    card.style.cssText = "background:#F7FBFD;border-radius:22px;padding:28px 30px;width:min(420px,88vw);box-sizing:border-box;font-family:'Baloo 2',sans-serif;color:#14333D;";
    scrim.appendChild(card);

    const header = document.createElement('div');
    header.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;';
    const title = document.createElement('div');
    title.textContent = 'Grown-up settings'; title.style.cssText = 'font-size:22px;font-weight:800;';
    const doneBtn = document.createElement('button');
    doneBtn.textContent = 'Done';
    doneBtn.style.cssText = "font-family:'Baloo 2',sans-serif;font-weight:800;font-size:14px;color:#14333D;background:#E2EEF3;border:none;border-radius:999px;padding:9px 20px;cursor:pointer;";
    doneBtn.addEventListener('click', () => this.closeSettings());
    header.appendChild(title); header.appendChild(doneBtn); card.appendChild(header);

    const mkLabel = txt => { const l = document.createElement('div'); l.textContent = txt; l.style.cssText = 'font-size:13px;font-weight:800;color:#5A7683;margin-bottom:6px;'; return l; };
    const selCss = "width:100%;font-family:'Baloo 2',sans-serif;font-size:15px;color:#14333D;background:#EAF3F6;border:none;border-radius:10px;padding:10px 12px;margin-bottom:16px;box-sizing:border-box;";

    card.appendChild(mkLabel('Level'));
    const levelSel = document.createElement('select'); levelSel.style.cssText = selCss;
    const levels = ['auto (adaptive)', '1 · count to 5', '2 · count to 10', '3 · add within 6', '4 · add within 10', '5 · take away (subtraction)', '6 · pearl groups (multiplication)', '7 · share the treats (division)', '8 · count to 20', '9 · tap until (missing addend)', '10 · make ten (number bonds)'];
    levels.forEach((label, i) => { const opt = document.createElement('option'); opt.value = i === 0 ? 'auto' : String(i); opt.textContent = label; levelSel.appendChild(opt); });
    levelSel.value = s.level === 'auto' ? 'auto' : String(s.level);
    levelSel.addEventListener('change', () => { const v = levelSel.value; this.saveSettings({ level: v === 'auto' ? 'auto' : +v }); });
    card.appendChild(levelSel);

    card.appendChild(mkLabel('Pacing'));
    const paceSel = document.createElement('select'); paceSel.style.cssText = selCss;
    [['natural', 'Natural (rounds start after 14s)'], ['quick', 'Quick (5s)']].forEach(([v, label]) => { const opt = document.createElement('option'); opt.value = v; opt.textContent = label; paceSel.appendChild(opt); });
    paceSel.value = s.pace;
    paceSel.addEventListener('change', () => this.saveSettings({ pace: paceSel.value }));
    card.appendChild(paceSel);

    const voiceRow = document.createElement('label');
    voiceRow.style.cssText = 'display:flex;align-items:center;gap:10px;font-size:15px;margin-bottom:16px;cursor:pointer;';
    const voiceCk = document.createElement('input');
    voiceCk.type = 'checkbox'; voiceCk.checked = !!s.voice; voiceCk.style.cssText = 'accent-color:#F4711F;width:18px;height:18px;';
    voiceCk.addEventListener('change', () => this.saveSettings({ voice: voiceCk.checked }));
    const voiceTxt = document.createElement('span'); voiceTxt.textContent = 'Voice';
    voiceRow.appendChild(voiceCk); voiceRow.appendChild(voiceTxt); card.appendChild(voiceRow);

    const hr = document.createElement('hr'); hr.style.cssText = 'border:none;border-top:1px solid rgba(20,51,61,0.15);margin:4px 0 14px;'; card.appendChild(hr);

    const progLine = document.createElement('div');
    progLine.style.cssText = 'font-size:13px;color:#5A7683;margin-bottom:16px;';
    card.appendChild(progLine);

    const clearBtn = document.createElement('button');
    clearBtn.style.cssText = "width:100%;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:15px;color:#FFFFFF;border:none;border-radius:12px;padding:13px;cursor:pointer;";
    clearBtn.addEventListener('click', () => this.onClearClick());
    card.appendChild(clearBtn);

    this._settingsEl = scrim; this._levelSel = levelSel; this._paceSel = paceSel; this._voiceCk = voiceCk;
    this._progLine = progLine; this._clearBtn = clearBtn;
    this.refreshProgressLine(); this.updateClearBtn();
    this.wrap.appendChild(scrim);
  }

  closeSettings() {
    if (!this.settingsOpen) return;
    this.settingsOpen = false;
    clearTimeout(this._clearArmTimer); this._clearArmTimer = null;
    this._clearState = 'idle';
    if (this._settingsEl && this._settingsEl.parentNode) this._settingsEl.parentNode.removeChild(this._settingsEl);
    this._settingsEl = null;
    this._gateTaps = [];
    this.gateCancel();
  }

  refreshProgressLine() {
    if (!this._progLine) return;
    this._progLine.textContent = 'Progress: level ' + this.progress().lvl + ' · ' + this.treasures.length + ' treasures collected';
  }

  updateClearBtn() {
    if (!this._clearBtn) return;
    const st = { idle: ['#7A97A5', 'Clear treasures & progress'], armed: ['#D6452B', 'Really clear everything? Tap again'], undo: ['#3E8E5A', 'Undo — bring it all back'] }[this._clearState];
    this._clearBtn.style.background = st[0]; this._clearBtn.textContent = st[1];
  }

  onClearClick() {
    if (this._clearState === 'idle') {
      this._clearState = 'armed'; this.updateClearBtn();
      clearTimeout(this._clearArmTimer);
      this._clearArmTimer = setTimeout(() => { this._clearState = 'idle'; this.updateClearBtn(); }, 3000);
    } else if (this._clearState === 'armed') {
      clearTimeout(this._clearArmTimer); this._clearArmTimer = null;
      this.performClear();
      this._clearState = 'undo'; this.updateClearBtn(); this.refreshProgressLine();
    } else {
      this.performUndo();
      this._clearState = 'idle'; this.updateClearBtn(); this.refreshProgressLine();
    }
  }

  performClear() {
    try { localStorage.setItem('tap-count-backup', JSON.stringify({ progress: this.progress(), treasures: this.treasures })); } catch (e) {}
    try { localStorage.removeItem('tap-count-progress'); } catch (e) {}
    try { localStorage.removeItem('tap-count-treasures'); } catch (e) {}
    this._prog = { lvl: 1, streak: 0 };
    this.treasures = [];
    this.petCount = 0;
    this.fish = this.fish.filter(f => f.color !== 'pet');
    this.bgIdx = 0;
    this.persist();
  }

  performUndo() {
    let backup = null;
    try { backup = JSON.parse(localStorage.getItem('tap-count-backup') || 'null'); } catch (e) {}
    if (!backup) return;
    try { localStorage.setItem('tap-count-progress', JSON.stringify(backup.progress || { lvl: 1, streak: 0 })); } catch (e) {}
    try { localStorage.setItem('tap-count-treasures', JSON.stringify(backup.treasures || [])); } catch (e) {}
    this._prog = backup.progress || { lvl: 1, streak: 0 };
    this.treasures = (backup.treasures || []).slice(0, 40).map((t, i) => Object.assign({ img: t.img }, this.tSlot(i)));
    this.fish = this.fish.filter(f => f.color !== 'pet');
    this.petCount = Math.min(this.petDefs.length, Math.floor(this.treasures.length / 5));
    for (let i = 0; i < this.petCount; i++) this.addPet(i, false);
    this.bgIdx = this.bgIdxFor(this.treasures.length); this.bgFade = 1;
    this.persist();
  }

  async boot() {
    const names = ['fish-orange', 'fish-blue', 'fish-yellow', 'fish-pink', 'fish-purple', 'fish-green', 'turtle', 'jelly-blue', 'jelly-pink', 'starfish', 'starfish-pink', 'coral-pink', 'shell', 'chest', 'star-gold', 'heart', 'bubble-speech', 'crab', 'gem-purple', 'gem-blue', 'gem-pink', 'gem-teal', 'coin', 'pearl-orb', 'clam-pink', 'clam-purple', 'star-big', 'seahorse', 'puffer', 'ray', 'hermit', 'weed-a', 'weed-b', 'weed-d', 'coral-blue', 'bg-reef', 'bg-wreck', 'bg-cave'];
    this.im = {};
    await Promise.all(names.map(n => { const i = new Image(); i.src = 'assets/kit/' + n + '.png'; return i.decode().then(() => { this.im[n] = i; }).catch(() => {}); }));
    try { await document.fonts.load('800 60px "Baloo 2"'); } catch (e) {}
    const fit = () => { if (!this.cv || !this.wrap) return; const dpr = Math.min(2, window.devicePixelRatio || 1); const r = this.wrap.getBoundingClientRect(); this.W = r.width; this.H = r.height; this.dpr = dpr; this.cv.width = Math.round(r.width * dpr); this.cv.height = Math.round(r.height * dpr); };
    this.ro = new ResizeObserver(fit); this.ro.observe(this.wrap); fit();
    try { this.lock = await navigator.wakeLock.request('screen'); } catch (e) {}

    this.settingsOpen = false; this._clearState = 'idle'; this._gateTaps = [];
    this.wrap.addEventListener('pointerup', e => this.gateCancel(e));
    this.wrap.addEventListener('pointercancel', e => this.gateCancel(e));
    this.wrap.addEventListener('pointermove', e => this.gateMove(e));

    this.treasures = []; try { this.treasures = JSON.parse(localStorage.getItem('tap-count-treasures') || '[]').slice(0, 40); } catch (e) {}
    this.treasures = this.treasures.map((t, i) => Object.assign({ img: t.img }, this.tSlot(i)));
    this.fish = []; this.parts = []; this.ambB = [];
    this.phase = 'free'; this.pt = 0; this.clock = 0; this.roundN = 4; this.counted = 0; this.lastTapT = 0; this.assistLvl = 0;
    this.turtle = { x: -0.22, y: 0.68, tx: 0.1, ty: 0.68, dir: 1, bob: Math.random() * 9 };
    const dCols = ['blue', 'yellow', 'pink', 'purple', 'green', 'blue', 'pink'];
    dCols.forEach((c, i) => this.addFish(c, Math.random(), 0.15 + Math.random() * 0.55));
    this.petCount = Math.min(this.petDefs.length, Math.floor(this.treasures.length / 5));
    for (let i = 0; i < this.petCount; i++) this.addPet(i, false);
    this.bgIdx = this.bgIdxFor(this.treasures.length); this.bgFade = 1;
    for (let i = 0; i < this.roundN; i++) this.addFish('orange', Math.random(), 0.2 + Math.random() * 0.45);
    this.jellies = [{ img: 'jelly-blue', x: 0.12, y: 0.5, s: 0.9, ph: 0 }, { img: 'jelly-pink', x: 0.9, y: 0.3, s: 1, ph: 3 }];
    this.crab = { x: 0.4, dir: 1, pause: 0 };
    this.last = performance.now();
    const loop = t => { if (this.dead) return; this.raf = requestAnimationFrame(loop); this.tick(t); };
    this.raf = requestAnimationFrame(loop);
  }

  petDefs = [
    { img: 'seahorse', base: 52, facing: -1, speed: 0.012, yr: [0.35, 0.65] },
    { img: 'puffer', base: 70, facing: -1, speed: 0.018, yr: [0.2, 0.55] },
    { img: 'ray', base: 110, facing: -1, speed: 0.026, yr: [0.55, 0.72] },
    { img: 'hermit', base: 56, facing: 1, speed: 0.008, yr: [0.78, 0.8] },
  ];
  addPet(i, entering) {
    const def = this.petDefs[i]; if (!def || this.fish.some(f => f.id === 'pet-' + def.img)) return;
    const f = { id: 'pet-' + def.img, color: 'pet', img: def.img, x: entering ? -0.12 : 0.15 + Math.random() * 0.7, y: def.yr[0] + Math.random() * (def.yr[1] - def.yr[0]), dir: 1, face: 1, speed: def.speed, ph: Math.random() * 9, mode: 'swim', bounce: 0, num: 0, wig: 0, shy: 0, facing: def.facing, petBase: def.base, yr: def.yr };
    f.wy = f.y; this.fish.push(f);
  }
  bgIdxFor(n) { return n >= 30 ? 3 : n >= 20 ? 2 : n >= 10 ? 1 : 0; }
  bgNames = ['', 'bg-reef', 'bg-wreck', 'bg-cave'];
  tSlot(i) { const col = i % 9, row = Math.floor(i / 9); return { x: 0.585 + col * 0.0435 + (row % 2) * 0.02, y: 0.902 - row * 0.03 }; }
  addFish(color, x, y) {
    const f = { id: Math.random(), color, img: 'fish-' + color, x, y, wy: y, dir: Math.random() < 0.5 ? 1 : -1, speed: 0.03 + Math.random() * 0.025, ph: Math.random() * 9, mode: 'swim', bounce: 0, num: 0, wig: 0, shy: 0 };
    f.facing = color === 'orange' ? -1 : 1; f.face = f.dir;
    this.fish.push(f); return f;
  }

  // ---------- audio ----------
  ac() { if (!this._ac) { try { this._ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return this._ac; }
  blip(f0, f1, dur, vol, type) {
    const a = this.ac(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f0, a.currentTime); o.frequency.exponentialRampToValueAtTime(f1, a.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.12, a.currentTime); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur);
  }
  chord() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.blip(f, f * 1.01, 0.35, 0.1, 'triangle'), i * 120)); }
  say(text, opts) {
    if (!this.voiceOn()) return;
    // recorded clips only; a missing clip means the line is silent
    const slug = text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 80);
    try {
      if (this.curClip) { try { this.curClip.pause(); } catch (e) {} }
      const a = new Audio('assets/voice/' + slug + '.mp3');
      this.curClip = a;
      a.play().catch(() => {});
    } catch (e) {}
  }

  // ---------- state machine ----------
  setPhase(p) { this.phase = p; this.pt = 0; }
  words = ['one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen', 'twenty'];

  slots(n, isAdd, A) {
    const out = [];
    if (isAdd) {
      for (const [cx, m, y0] of [[0.32, A, 0.34], [0.7, n - A, 0.36]]) {
        const sp = m > 1 ? Math.min(0.11, 0.3 / (m - 1)) : 0;
        for (let i = 0; i < m; i++) out.push({ x: cx + (i - (m - 1) / 2) * sp, y: y0 + (i % 2) * 0.07 });
      }
    } else if (n <= 5) {
      const sp = Math.min(0.2, 0.72 / Math.max(1, n - 1));
      for (let i = 0; i < n; i++) out.push({ x: 0.52 + (i - (n - 1) / 2) * sp, y: 0.32 + (i % 2) * 0.09 });
    } else if (n <= 10) {
      const top = Math.ceil(n / 2);
      [[top, 0.24], [n - top, 0.44]].forEach(([m, y0]) => {
        const sp = Math.min(0.15, 0.7 / Math.max(1, m - 1));
        for (let i = 0; i < m; i++) out.push({ x: 0.52 + (i - (m - 1) / 2) * sp, y: y0 + (i % 2) * 0.045 });
      });
    } else {
      const top = Math.ceil(n / 3), mid = Math.ceil((n - top) / 2);
      [[top, 0.2], [mid, 0.35], [n - top - mid, 0.5]].forEach(([m, y0]) => {
        const sp = Math.min(0.11, 0.7 / Math.max(1, m - 1));
        for (let i = 0; i < m; i++) out.push({ x: 0.52 + (i - (m - 1) / 2) * sp, y: y0 + (i % 2) * 0.045 });
      });
    }
    return out;
  }

  startRound() {
    const stored = Math.max(1, Math.min(10, this.progress().lvl));
    const pinned = this.settings().level !== 'auto';
    let lvl = pinned ? this.settings().level : stored;
    this.isReview = false;
    if (!pinned && stored >= 6) { // mixed review: mastered levels stay warm
      const mastered = stored === 10 && this.progress().streak >= 2;
      if (mastered) { lvl = 1 + Math.floor(Math.random() * 10); this.isReview = lvl !== stored; }
      else if (Math.random() < 0.5) { lvl = 1 + Math.floor(Math.random() * (stored - 1)); this.isReview = true; }
    }
    this.roundType = 'count'; this.A = 0; this.B = 0; this.T = 0;
    if (lvl === 1) this.roundN = 2 + Math.floor(Math.random() * 4);
    else if (lvl === 2) this.roundN = 6 + Math.floor(Math.random() * 5);
    else if (lvl === 5) {
      this.roundType = 'sub';
      this.A = 4 + Math.floor(Math.random() * 5);              // 4..8 fish arrive
      this.B = 1 + Math.floor(Math.random() * (this.A - 2));   // some swim away, at least 2 stay
      this.roundN = this.A - this.B;
    } else if (lvl === 6) {
      this.roundType = 'mul';
      this.A = 2 + Math.floor(Math.random() * 2);   // shells (groups)
      this.B = 2 + Math.floor(Math.random() * 2);   // pearls in each
      this.roundN = this.A * this.B;
    } else if (lvl === 7) {
      this.roundType = 'div';
      this.A = 2 + Math.floor(Math.random() * 2);   // fish to share between
      this.B = 2 + Math.floor(Math.random() * 2);   // treats each
      this.roundN = this.A * this.B;                // total treats
    } else if (lvl === 8) {
      this.roundN = 11 + Math.floor(Math.random() * 10); // count to 20
    } else if (lvl === 9) {
      this.roundType = 'until';                     // missing addend: make it T
      this.T = 5 + Math.floor(Math.random() * 5);   // target 5..9
      this.A = 2 + Math.floor(Math.random() * (this.T - 3)); // 2..T-2 already here
      this.B = this.T - this.A;                     // new fish she taps in
      this.roundN = this.T;
    } else if (lvl === 10) {
      this.roundType = 'bond';                      // make ten: number bonds
      this.A = 3 + Math.floor(Math.random() * 6);   // 3..8 pearls to start
      this.B = 10 - this.A;                         // clams to open
      this.roundN = 10; this.T = 10;
    } else {
      this.roundType = 'add';
      const hi = lvl === 3 ? 3 : 5, lo = lvl === 3 ? 1 : 2;
      this.A = lo + Math.floor(Math.random() * (hi - lo + 1));
      this.B = lo + Math.floor(Math.random() * (hi - lo + 1));

  finishRound() {

      pr.streak = this.assistMax >= 2 ? Math.min(0, pr.streak) - 1 : Math.max(0, pr.streak) + 1;
      if (pr.streak >= 2 && pr.lvl < 10) { pr.lvl++; pr.streak = 0; }
      if (pr.lvl === 10 && pr.streak >= 2) pr.streak = 2; // mastered: hold here

        this.blip(500 + g * 130, 720 + g * 130, 0.16, 0.12, 'triangle');

  burst(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 0.1 + Math.random() * 0.22;
      this.parts.push({ img: ['star-gold', 'heart', null][Math.floor(Math.random() * 3)], x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 0.08, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 6, life: 1, sz: 18 + Math.random() * 22 });
    }
  }
  bubblesAt(x, y, n) { for (let i = 0; i < n; i++) this.parts.push({ img: null, x: x + (Math.random() - 0.5) * 0.03, y, vx: (Math.random() - 0.5) * 0.02, vy: -0.1 - Math.random() * 0.08, rot: 0, vr: 0, life: 1.2, sz: 8 + Math.random() * 10, bub: true }); }

  // ---------- interaction ----------
  gateDown(e, x, y) {
    if (!(x < 0.15 && y < 0.15)) return;

    this._gateTaps = (this._gateTaps || []).filter(tt => now - tt < 1500);
    this._gateTaps.push(now);

      clearTimeout(this._gateHoldTimer); this._gateHoldTimer = null;
      this.openSettings();

    }
    this._gateHoldId = e.pointerId;
    clearTimeout(this._gateHoldTimer);
    this._gateHoldTimer = setTimeout(() => { this._gateHoldTimer = null; this.openSettings(); }, 2000);
  }
  gateCancel(e) {
    if (this._gateHoldTimer && (!e || e.pointerId === this._gateHoldId)) { clearTimeout(this._gateHoldTimer); this._gateHoldTimer = null; }
  }
  gateMove(e) {

  tap(e) {

  fishScale() { return Math.max(0.7, Math.min(1.5, Math.min(this.W, this.H) / 760)); }

  // ---------- simulation ----------
  tick(t) {

    const sandU = 0.85;

    if (this.phase === 'free' && this.settingsOpen) this.pt = 0;
    if (this.phase === 'free' && this.pt > this.freeDur()) this.startRound();
    if (this.phase === 'invite' && this.pt > ({ add: 5.6, sub: 7.4, mul: 5.8, div: 6.2, until: 5.6, bond: 5.2 }[this.roundType] || 2.6)) { this.setPhase('count'); this.lastTapT = this.clock; }

      const s = this.tSlot(this.treasures.length % 40);

      this.blip(880, 1320, 0.4, 0.08);
    }
    if (this.phase === 'reward') {
      if (this.falling) {
        this.falling.y += (this.falling.ty - this.falling.y) * Math.min(1, dt * 2.2);
        if (this.falling.ty - this.falling.y < 0.01 && !this.falling.done) {
          this.falling.done = true; this.burst(this.falling.x, this.falling.y - 0.03, 6);
          this.treasures.push({ img: this.falling.img, x: this.falling.x, y: this.falling.ty });
          try { localStorage.setItem('tap-count-treasures', JSON.stringify(this.treasures.slice(-40))); } catch (e) {}
          this.persist();
          const nbg = this.bgIdxFor(this.treasures.length);
          if (nbg > this.bgIdx) { // 10/20/30 treasures: the whole tank transforms
            this.bgIdx = nbg; this.bgFade = 0;
            setTimeout(() => { if (!this.dead) { this.say('Wow! Look! Our whole tank is changing!'); this.chord(); } }, 3200);
          }
          const nc = Math.min(this.petDefs.length, Math.floor(this.treasures.length / 5));
          if (nc > this.petCount) { // every 5th treasure: a creature joins the tank for good
            this.petCount = nc;
            setTimeout(() => { if (!this.dead) { this.say('Wow! A new friend is joining our tank!'); this.addPet(nc - 1, true); this.chord(); } }, 1400);
          }
        }
      }
      if (this.pt > 2.6) {
        this.falling = null; this.turtle.tx = 0.1; this.turtle.ty = 0.68; this.turtle.dir = 1;
        for (const f of this.fish) if (f.mode !== 'leave') { f.mode = 'swim'; f.num = 0; f.loop = null; }
        this.pearls = null; this.shells = null; this.clams = null; this.feedFish = null; this.flying = [];
        this.setPhase('free');
      }
    }

    // turtle
    const tu = this.turtle;

        f.y += (qy + Math.sin(this.clock * 1.4 + f.ph) * 0.012 - f.y) * Math.min(1, dt * 2);
        f.dir = -1;
      } else if (f.mode === 'back') {
        f.x += (f.bx - f.x) * Math.min(1, dt * 0.9) * beat; f.y += (f.by - f.y) * Math.min(1, dt * 0.9) * beat;
        if (f.shy > 0) f.x += (f.x > 0.5 ? 1 : -1) * dt * 0.12;
      } else if (f.mode === 'leave') {
        f.x += f.dir * 0.26 * dt * beat; f.y += (f.vy || 0) * dt;
      }
    }
    this.fish = this.fish.filter(f => !(f.mode === 'leave' && (f.x < -0.15 || f.x > 1.15)));

    // pearls + flying treats
    if (this.pearls) for (const p2 of this.pearls) { p2.bounce = Math.max(0, p2.bounce - dt * 1.6); p2.wig = Math.max(0, p2.wig - dt * 1.2); }
    if (this.clams) for (const c2 of this.clams) { c2.bounce = Math.max(0, c2.bounce - dt * 1.6); c2.wig = Math.max(0, c2.wig - dt * 1.2); }
    if (this.flying && this.flying.length) {
      for (const fl of this.flying) {
        fl.t += dt * 1.8;
        if (fl.t >= 1 && !fl.done) { fl.done = true; fl.f.fed++; fl.f.bounce = 1; this.blip(700, 980, 0.12, 0.12); this.bubblesAt(fl.f.x, fl.f.y - 0.03, 2); }
      }
      this.flying = this.flying.filter(fl => !fl.done);
    }
    if (this.roundType === 'div' && (this.phase === 'count' || this.phase === 'invite') && this.pellLeft <= 0 && this.flying && !this.flying.length && !this._divDone) { this._divDone = true; setTimeout(() => this.finishRound(), 500); }

    // jellies, crab
    for (const j of this.jellies) {
      j.ph += dt;
      const pump = Math.max(0, Math.sin(j.ph * 2.2)); // contraction propels it upward
      j.y -= dt * (0.006 + pump * 0.022);
      j.x += Math.sin(j.ph * 0.5) * dt * 0.012;
      if (j.y < -0.12) { j.y = 0.98; j.x = 0.08 + Math.random() * 0.84; }
      j.squish = Math.max(0, (j.squish || 0) - dt * 1.5);
    }
    const cb = this.crab; cb.pause -= dt;
    if (cb.pause <= 0) { cb.x += cb.dir * 0.02 * dt * 60 / 60; if (Math.random() < dt * 0.3) cb.pause = 1 + Math.random() * 2; if (cb.x > 0.6) cb.dir = -1; if (cb.x < 0.08) cb.dir = 1; }

    // ambient bubbles
    if (Math.random() < dt * 0.7) this.ambB.push({ x: 0.1 + Math.random() * 0.8, y: 1.02, sz: 5 + Math.random() * 8, v: 0.05 + Math.random() * 0.05 });
    for (const b of this.ambB) b.y -= b.v * dt;
    this.ambB = this.ambB.filter(b => b.y > -0.05);

    // particles
    for (const p of this.parts) { p.x += p.vx * dt; p.y += p.vy * dt; if (!p.bub) p.vy += dt * 0.25; p.rot += p.vr * dt; p.life -= dt * (p.bub ? 0.8 : 0.9); }
    this.parts = this.parts.filter(p => p.life > 0);

    this.draw(sandU, fsc);
  }

  // ---------- drawing ----------
  drawImgC(ctx, img, x, y, w, flip, rot, sy, sx) {
    if (!img) return;
    const h = w * img.height / img.width;
    ctx.save(); ctx.translate(x, y);
    if (rot) ctx.rotate(rot);
    ctx.scale((flip ? -1 : 1) * (sx || 1), sy || 1);
    ctx.drawImage(img, -w / 2, -h / 2, w, h);
    ctx.restore();
    return h;
  }

  draw(sandU, fsc) {
    const ctx = this.cv.getContext('2d'), W = this.W, H = this.H, im = this.im;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    // water
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#A9E4F6'); g.addColorStop(0.45, '#5FBFE3'); g.addColorStop(1, '#2E93C4');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const bgIm = im[this.bgNames[this.bgIdx || 0]];
    if (bgIm) { // unlocked backdrop, cover-fit, fades in on unlock
      const s = Math.max(W / bgIm.width, H / bgIm.height), bw2 = bgIm.width * s, bh2 = bgIm.height * s;
      ctx.save(); ctx.globalAlpha = this.bgFade == null ? 1 : this.bgFade;
      ctx.drawImage(bgIm, (W - bw2) / 2, (H - bh2) / 2, bw2, bh2);
      ctx.restore();
    }
    // light rays
    ctx.save(); ctx.globalAlpha = 0.1; ctx.fillStyle = '#FFFFFF';
    for (let i = 0; i < 4; i++) {
      const bx = (0.15 + i * 0.24) * W + Math.sin(this.clock * 0.3 + i) * 30;
      ctx.beginPath(); ctx.moveTo(bx - 30, 0); ctx.lineTo(bx + 40, 0); ctx.lineTo(bx + 150, H * 0.75); ctx.lineTo(bx - 10, H * 0.75); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    const sandY = sandU * H;
    const dimOthers = this.phase === 'invite' || this.phase === 'count';
    // back fish (non-orange during challenge draw behind sand deco)
    const fishless = this.roundType === 'mul' || this.roundType === 'bond';
    for (const f of this.fish) {
      if ((dimOthers || this.phase === 'celebrate') && f.color === 'orange' && !fishless) continue;
      this.drawFish(ctx, f, fsc, dimOthers && (f.color !== 'orange' || fishless) ? 0.45 : 1);
    }
    // sand
    ctx.fillStyle = '#F2DC96';
    ctx.beginPath(); ctx.moveTo(0, sandY + 10);
    for (let x = 0; x <= W; x += W / 10) ctx.quadraticCurveTo(x + W / 20, sandY + ((x / W * 5) % 2 ? -8 : 8), x + W / 10, sandY + 4);
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(214,178,106,0.5)'; ctx.fillRect(0, Math.min(H, sandY + H * 0.07), W, H);
    // deco
    const sway = Math.sin(this.clock * 0.8) * 0.04;
    const weed = (wimg, x, rot, h) => { if (!wimg) return; const wH = (h || 150) * fsc, wW = wH * wimg.width / wimg.height; ctx.save(); ctx.translate(x, sandY + 10); ctx.rotate(rot); ctx.drawImage(wimg, -wW / 2, -wH, wW, wH); ctx.restore(); };
    weed(im['weed-b'], 0.05 * W, sway, 160); weed(im['weed-a'], 0.115 * W, -sway * 0.7, 110); weed(im['weed-d'], 0.945 * W, -sway, 165);
    this.drawImgC(ctx, im['coral-blue'], 0.17 * W, sandY - 34 * fsc, 76 * fsc);
    this.drawImgC(ctx, im['coral-pink'], 0.24 * W, sandY - 28 * fsc, 64 * fsc);
    // starfish (hop on celebrate)
    const hop = this.starHop && this.clock - this.starHop < 1.6 ? Math.abs(Math.sin((this.clock - this.starHop) * 6)) * 26 * fsc : 0;
    this.drawImgC(ctx, im.starfish, 0.33 * W, sandY + 20 * fsc - hop, 52 * fsc, false, Math.sin(this.clock) * 0.08);
    this.drawImgC(ctx, im['starfish-pink'], 0.55 * W, sandY + 26 * fsc - hop * 0.7, 40 * fsc, true, -0.2);
    // crab
    this.drawImgC(ctx, im.crab, this.crab.x * W, sandY + 14 * fsc - (this.crab.pause <= 0 ? Math.abs(Math.sin(this.clock * 7)) * 5 : 0), 70 * fsc, this.crab.dir < 0);
    // chest + treasures
    this.drawImgC(ctx, im.chest, 0.86 * W, sandY + 22 * fsc, 92 * fsc);
    const tW = { shell: 40, 'star-gold': 32, heart: 32, 'starfish-pink': 38, coin: 28, 'pearl-orb': 32, 'clam-pink': 38, 'clam-purple': 38, 'star-big': 36 };
    for (const tr of this.treasures) this.drawImgC(ctx, im[tr.img], tr.x * W, tr.y * H, (tW[tr.img] || 28) * fsc, false, Math.sin(tr.x * 40) * 0.3);
    if (this.falling) this.drawImgC(ctx, im[this.falling.img], this.falling.x * W, this.falling.y * H, (tW[this.falling.img] || 28) * 1.15 * fsc, false, Math.sin(this.clock * 3) * 0.2);
    // jellies
    for (const j of this.jellies) {
      const pump = Math.max(0, Math.sin(j.ph * 2.2)) + (j.squish || 0) * 1.6;
      this.drawImgC(ctx, im[j.img], j.x * W, j.y * H, 62 * fsc * j.s * (1 + pump * 0.09), false, Math.sin(j.ph * 0.7) * 0.1, 1 - pump * 0.12);
    }
    // turtle
    const tu = this.turtle;
    if (tu.x > -0.2) {
      const tw = 150 * fsc;
      const paddling = Math.abs(tu.tx - tu.x) > 0.01;
      this.drawImgC(ctx, im.turtle, tu.x * W, (tu.y + Math.sin(tu.bob * 1.6) * 0.012) * H, tw * (1 + Math.sin(tu.bob * 3.2) * (paddling ? 0.02 : 0.008)), tu.dir > 0, Math.sin(tu.bob * 1.6 + 1) * 0.07);
    }
    // target fish on top
    if ((dimOthers || this.phase === 'celebrate') && !fishless) for (const f of this.fish) if (f.color === 'orange') this.drawFish(ctx, f, fsc, f.mode === 'wait' ? 0.45 : 1, f.mode === 'gather' || f.mode === 'pregather');
    this.drawMulDiv(ctx, sandY, fsc);
    if ((this.phase === 'invite' || this.phase === 'count') && this.roundType !== 'div') this.drawPrompt(ctx, fsc); // prompt strip on top, near the surface
    // assist ring
    if (this.phase === 'count' && this.assistLvl >= 1) {
      const next = this.roundType === 'div' ? (this.feedFish || []).slice().sort((a, b) => a.fed - b.fed)[0] : (this.targets || []).find(x => !x.num);
      if (next) {
        const pr = (this.clock * 1.5) % 1;
        ctx.save(); ctx.globalAlpha = (1 - pr) * 0.7; ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.ellipse(next.x * W, next.y * H + 52 * fsc, (40 + pr * 44) * fsc, (14 + pr * 16) * fsc, 0, 0, 7); ctx.stroke(); ctx.restore();
      }
    }
    // particles
    for (const p of this.parts) {
      ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      if (p.bub || !p.img) {
        ctx.strokeStyle = '#EAF9FF'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(p.x * W, p.y * H, p.sz * 0.5 * fsc, 0, 7); ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fill();
      } else { const pop = Math.min(1, (1 - p.life) * 6 + 0.25) * (0.55 + 0.45 * p.life); this.drawImgC(ctx, im[p.img], p.x * W, p.y * H, p.sz * fsc * pop, false, p.rot); }
      ctx.restore();
    }
    // ambient bubbles
    ctx.strokeStyle = 'rgba(240,252,255,0.6)'; ctx.lineWidth = 2;
    for (const b of this.ambB) { ctx.beginPath(); ctx.arc(b.x * W + Math.sin(b.y * 12) * 8, b.y * H, b.sz * 0.5 * fsc, 0, 7); ctx.stroke(); }
  }

  pellet(ctx, x, y, r) {
    ctx.save();
    const g2 = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.2, x, y, r);
    g2.addColorStop(0, '#DDA75F'); g2.addColorStop(1, '#996829');
    ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    ctx.restore();
  }

  drawMulDiv(ctx, sandY, fsc) {
    const im = this.im, W = this.W, H = this.H;
    if (this.shells) for (const s of this.shells) this.drawImgC(ctx, im.shell, s.x * W, sandY - 16 * fsc, 88 * fsc);
    if (this.clams) for (const c of this.clams) { // make-ten: closed clams wait on the sand
      const bo = c.bounce > 0 ? -Math.sin((1 - Math.min(1, c.bounce)) * Math.PI) * 20 * fsc : 0;
      const wob = Math.sin(this.clock * 12) * 4 * c.wig;
      const cx = c.x * W + wob, cy = c.y * H + Math.sin(this.clock * 1.6 + c.seed) * 2 + bo;
      ctx.save();
      if (c.num) { ctx.shadowColor = 'rgba(255,214,79,0.95)'; ctx.shadowBlur = 18; }
      this.drawImgC(ctx, im[c.img], cx, cy, (c.w || 64) * fsc);
      ctx.restore();
      if (c.num) {
        const r = 15 * fsc, ny = cy - 44 * fsc;
        ctx.save();
        ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.strokeStyle = '#FF8A3C'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(cx, ny, r, 0, 7); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#F4711F'; ctx.font = '800 ' + Math.round(r * (c.num > 9 ? 1.0 : 1.3)) + 'px "Baloo 2", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(String(c.num), cx, ny + r * 0.08);
        ctx.restore();
      }
    }
    if (this.pearls) {
      for (const p of this.pearls) {
        const bo = p.bounce > 0 ? -Math.sin((1 - Math.min(1, p.bounce)) * Math.PI) * 22 * fsc : 0;
        const wob = Math.sin(this.clock * 12) * 4 * p.wig;
        const px = p.x * W + wob, py = p.y * H + Math.sin(this.clock * 1.6 + p.seed) * 4 + bo;
        const r = 19 * fsc;
        ctx.save();
        if (p.num) { ctx.shadowColor = 'rgba(255,214,79,0.95)'; ctx.shadowBlur = 18; }
        const gr = ctx.createRadialGradient(px - r * 0.35, py - r * 0.4, r * 0.15, px, py, r);
        gr.addColorStop(0, '#FFFFFF'); gr.addColorStop(0.7, '#EAF0F6'); gr.addColorStop(1, '#B9C8D8');
        ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(px, py, r, 0, 7); ctx.fill();
        ctx.strokeStyle = 'rgba(90,110,130,0.45)'; ctx.lineWidth = 2; ctx.stroke();
        if (p.num) { ctx.fillStyle = '#F4711F'; ctx.font = '800 ' + Math.round(r * 1.2) + 'px "Baloo 2", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(p.num), px, py + 1); }
        ctx.restore();
      }
    }
    if (this.feedFish) {
      for (let i = 0; i < this.pellLeft; i++) {
        const px = (0.5 + ((i % 5) - 2) * 0.032) * W, py = (0.1 + Math.floor(i / 5) * 0.04) * H + Math.sin(this.clock * 2 + i) * 2;
        this.pellet(ctx, px, py, 9 * fsc);
      }
      for (const fl of this.flying || []) {
        const t = Math.min(1, fl.t), xx = 0.5 + (fl.f.x - 0.5) * t, yy = 0.12 + (fl.f.y - 0.12) * t - Math.sin(t * Math.PI) * 0.1;
        this.pellet(ctx, xx * W, yy * H, 10 * fsc);
      }
      for (const f of this.feedFish) for (let i = 0; i < (f.fed || 0); i++) this.pellet(ctx, f.x * W + (i - (f.fed - 1) / 2) * 24 * fsc, f.y * H + 60 * fsc, 8 * fsc);
    }
  }

  drawFish(ctx, f, fsc, alpha, isTarget) {
    const im = this.im[f.img]; if (!im || f.color === 'gone' && !im) return;
    const base = f.petBase || (f.color === 'orange' ? 128 : { blue: 86, yellow: 82, pink: 70, purple: 56, green: 72 }[f.color] || 80);
    let w = base * fsc * (isTarget ? 1.15 : 1);
    if (isTarget) w = Math.min(w, this.W * (this.slotPitch || 0.2) * 1.45, this.H * 0.27);
    f.w = w;
    // tap bounce: anticipation squash -> hop with stretch -> soft landing
    const p = 1 - Math.min(1, f.bounce);
    const hopY = f.bounce > 0 ? -Math.sin(p * Math.PI) * 38 * fsc : 0;
    let sy = 1;
    if (f.bounce > 0) sy = 1 + Math.sin(p * Math.PI * 2 - Math.PI / 2) * 0.15 * (1 - p * 0.5);
    // celebration loop-de-loop: fly a vertical circle
    let loopOx = 0, loopOy = 0, loopRot = 0;
    if (f.loop != null && f.loop > 0) { const a = Math.min(1, f.loop) * Math.PI * 2, r = 46 * fsc; loopOx = Math.sin(a) * r; loopOy = -(1 - Math.cos(a)) * r * 0.8; loopRot = -a; }
    const wigR = Math.sin(this.clock * 13) * 0.3 * f.wig * f.wig;
    const swimRot = Math.sin(f.ph * 0.9) * 0.05;   // gentle body rock with the tail beat
    const bobY = Math.sin(f.ph * 0.9) * w * 0.04;
    const face = f.face === undefined ? f.dir : f.face;
    let sx = face * (f.facing || 1); sx = (sx < 0 ? -1 : 1) * Math.max(0.15, Math.abs(sx)); // thin mid-turn
    sx *= 2 - sy; // preserve volume through squash/stretch
    const rot = loopRot + wigR + swimRot;
    ctx.save(); ctx.globalAlpha = alpha;
    if (isTarget && !f.num && !f.noGlow) { ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 14; }
    if (f.num) { ctx.shadowColor = 'rgba(255,214,79,0.95)'; ctx.shadowBlur = 20; }
    this.drawImgC(ctx, im, f.x * this.W + loopOx, f.y * this.H + hopY + bobY + loopOy, w, false, rot, sy, sx);
    ctx.restore();
    const bounceY = hopY + bobY + loopOy;
    if (f.num) {
      const bx = f.x * this.W + loopOx, by = f.y * this.H - w * 0.62 + bounceY + Math.sin(this.clock * 2 + f.num) * 3;
      const r = Math.max(20, w * 0.26);
      ctx.save();
      ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.strokeStyle = '#FF8A3C'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(bx, by, r, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#F4711F'; ctx.font = '800 ' + Math.round(r * (f.num > 9 ? 1.0 : 1.3)) + 'px "Baloo 2", "Comic Sans MS", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(f.num), bx, by + r * 0.08);
      ctx.restore();
    }
  }

  drawPrompt(ctx, fsc) {
    const im = this.im;
    const bw = Math.min(this.W * 0.72, 640 * fsc);
    const bx = this.W / 2, by = Math.max(52 * fsc, this.H * 0.085), bh = 0;
    if (this.roundType === 'mul') { // groups of pearl dots
      const G = this.A, P = this.B, dr = Math.min(13 * fsc, bw * 0.035), gap = dr * 2.6;
      const total = G * P * dr * 2.4 + (G - 1) * gap;
      let k = 0;
      for (let g = 0; g < G; g++) for (let j = 0; j < P; j++) {
        const px = bx - total / 2 + dr + k * dr * 2.4 + g * gap, py = by - bh * 0.08;
        ctx.save(); ctx.globalAlpha = k < this.counted ? 1 : 0.5;
        const gr = ctx.createRadialGradient(px - dr * 0.3, py - dr * 0.3, dr * 0.2, px, py, dr);
        gr.addColorStop(0, '#FFFFFF'); gr.addColorStop(1, '#B9C8D8');
        ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(px, py, dr, 0, 7); ctx.fill();
        ctx.strokeStyle = 'rgba(90,110,130,0.4)'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore();
        k++;
      }
      return;
    }
    if (this.roundType === 'bond') { // one group of ten pearl dots, filling toward ten
      const dr = Math.min(13 * fsc, bw * 0.035);
      const total = 10 * dr * 2.4;
      for (let k = 0; k < 10; k++) {
        const px = bx - total / 2 + dr + k * dr * 2.4, py = by - bh * 0.08;
        ctx.save(); ctx.globalAlpha = k < this.A + this.counted ? 1 : 0.5;
        const gr = ctx.createRadialGradient(px - dr * 0.3, py - dr * 0.3, dr * 0.2, px, py, dr);
        gr.addColorStop(0, '#FFFFFF'); gr.addColorStop(1, '#B9C8D8');
        ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(px, py, dr, 0, 7); ctx.fill();
        ctx.strokeStyle = 'rgba(90,110,130,0.4)'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore();
      }
      return;
    }
    if (this.roundType === 'div') { // mini fish, treats fill in beneath each
      const D = this.A, fw2 = Math.min(38, bw * 0.7 / D);
      for (let i = 0; i < D; i++) {
        const mx = bx - (D - 1) / 2 * fw2 * 1.4 + i * fw2 * 1.4, my2 = by - bh * 0.16;
        this.drawImgC(ctx, this.im['fish-orange'], mx, my2, fw2 * 0.9, true);
        const fed = (this.feedFish && this.feedFish[i]) ? this.feedFish[i].fed : 0;
        for (let j = 0; j < fed; j++) this.pellet(ctx, mx + (j - (fed - 1) / 2) * 11, my2 + fw2 * 0.6, 4.5);
      }
      return;
    }
    // mini orange fish inside, filled in as counted; add/sub/until show two groups with a sign
    const n = this.roundN, isAdd = this.roundType === 'add', isSub = this.roundType === 'sub', isUntil = this.roundType === 'until', A = this.A;
    const showN = isSub ? A + this.B : n;      // subtraction reads "A − B": school, then the take-away group
    const split = isAdd || isSub || isUntil ? A : -1; // where the sign sits
    const gap = split > 0 ? Math.min(34 * fsc, bw * 0.09) : 0;
    const fw = Math.min(58 * fsc, (bw * 0.9 - gap) / showN);
    const total = showN * fw + gap, my = by - bh * 0.08;
    const xs = []; for (let i = 0; i < showN; i++) xs.push(bx - total / 2 + fw / 2 + i * fw + (split > 0 && i >= split ? gap : 0));
    if (split > 0 && split < showN) {
      ctx.save(); ctx.fillStyle = '#F4711F'; ctx.font = '800 ' + Math.round(fw * 0.9) + 'px "Baloo 2", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(isSub ? '\u2212' : '+', (xs[split - 1] + xs[split]) / 2, my); ctx.restore();
    }
    for (let i = 0; i < showN; i++) {
      let a;
      if (isSub) {
        const inMinus = i >= A;                        // the "take away" group after the sign
        const leftSlot = !inMinus && i >= A - this.B;  // school members who swim off
        a = inMinus ? (this.subGone ? 0.95 : 0.3) : leftSlot && this.subGone ? 0.28 : i < this.counted ? 1 : 0.85;
      } else if (isUntil) a = i < A ? 1 : (i - A) < this.counted ? 1 : 0.35;
      else a = i < this.counted ? 1 : 0.5;
      ctx.save(); ctx.globalAlpha = a;
      this.drawImgC(ctx, im['fish-orange'], xs[i], my, fw * 0.9, true);
      ctx.restore();
      const showNum = isUntil ? i >= A && (i - A) < this.counted : i < this.counted && (!isSub || i < A - this.B);
      if (showNum) { // until: running totals appear over the new arrivals (A+1 ... T)
        ctx.save(); ctx.fillStyle = '#F4711F'; ctx.font = '800 ' + Math.round(fw * 0.42) + 'px "Baloo 2", sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(String(i + 1), xs[i], my - fw * 0.5); ctx.restore();
      }
    }
  }
}
</script>
